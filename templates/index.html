<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flood Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">EPIC 5 · APPLICATION BUILDING</p>
      <h1>Flood prediction</h1>
      <p>Enter environmental and rainfall measurements to estimate flood risk. Rainfall values are in millimetres (mm).</p>
    </section>
    <section class="card">
      <h2>Prediction details</h2>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form action="{{ url_for('predict') }}" method="post">
        <div class="fields">
          {% for field in fields %}
          <label>
            <span>{{ field.label }}</span>
            <small>{{ field.help }}</small>
            <input type="number" name="{{ field.name }}" value="{{ defaults[field.name] }}" step="any" required>
          </label>
          {% endfor %}
        </div>
        <button type="submit">Predict flood risk</button>
      </form>
    </section>
  </main>
</body>
</html>
